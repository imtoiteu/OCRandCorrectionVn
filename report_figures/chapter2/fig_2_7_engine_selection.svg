<text x="40" y="38" font-size="20" font-weight="700" fill="#10202E">Hình 2.7 – Cơ chế lựa chọn công cụ OCR theo đặc điểm tài liệu</text>
<line x1="40" y1="48" x2="1300" y2="48" stroke="#10202E" stroke-width="1.5"/>
<text x="40" y="64" font-size="11.5" fill="#5A6B7B">The mechanism as implemented — app.py::_resolve_selected_engine(), router.py::normalize_engine_name(), glm_vietocr_adapter.py</text>
