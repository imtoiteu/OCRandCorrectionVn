<path d="M40.0,92.0 h1246.0 l14.0,14.0 v60.0 h-1260.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1286.0,92.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="670.0" y="125.7" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">IMPORTANT — the system does NOT implement automatic engine selection from document content. No code inspects layout complexity, language or image quality to choose an engine. The engine is chosen by the</text>
<text x="670.0" y="139.1" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">user (UI drop-down) or by configuration; only two rule-based decisions exist, and both are shown below.</text>
<rect x="460.0" y="196.0" width="420.0" height="46.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="670.0" y="222.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">OCR request:  {file_id, page, engine?}</text>
<polygon points="670.0,268.0 900.0,302.0 670.0,336.0 440.0,302.0" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="670.0" y="298.9" font-size="10.5" font-weight="400" fill="#15202B" text-anchor="middle">Was an &quot;engine&quot; value sent</text>
<text x="670.0" y="311.7" font-size="10.5" font-weight="400" fill="#15202B" text-anchor="middle">with the request?</text>
<rect x="40.0" y="278.0" width="340.0" height="62.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="210.0" y="306.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">No → fall back to cfg.OCR_ENGINE</text>
<text x="210.0" y="318.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">(env OCR_ENGINE, default &quot;paddle&quot;)</text>
<rect x="960.0" y="254.0" width="340.0" height="110.0" rx="9" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
<text x="1130.0" y="287.7" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Yes → the value chosen in the SPA drop-down</text>
<text x="1130.0" y="299.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">&quot;Recommended&quot;  → glmocr</text>
<text x="1130.0" y="312.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">&quot;GLM Layout + VietOCR Text&quot;  → glm_vietocr</text>
<text x="1130.0" y="324.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">&quot;Vietnamese&quot;  → vietocr</text>
<text x="1130.0" y="336.5" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">&quot;Standard&quot;  → paddleocr</text>
<rect x="440.0" y="368.0" width="460.0" height="66.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="670.0" y="392.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">normalize_engine_name(): alias table</text>
<text x="670.0" y="403.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">paddle|auto→paddleocr · modern|ppstructure→paddleocr_modern</text>
<text x="670.0" y="415.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm|glm_ocr→glmocr · glm_layout_vietocr→glm_vietocr</text>
<rect x="960.0" y="380.0" width="340.0" height="46.0" rx="9" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
<text x="1130.0" y="406.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Unknown alias → ValueError → HTTP 400</text>
<polygon points="670.0,466.0 920.0,504.0 670.0,542.0 420.0,504.0" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="670.0" y="500.9" font-size="10.5" font-weight="400" fill="#15202B" text-anchor="middle">RULE 1 (file-type rule)</text>
<text x="670.0" y="513.7" font-size="10.5" font-weight="400" fill="#15202B" text-anchor="middle">selected == &quot;vietocr&quot;  AND  file suffix == &quot;.pdf&quot; ?</text>
<rect x="960.0" y="476.0" width="340.0" height="58.0" rx="9" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
<text x="1130.0" y="502.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">effective = &quot;paddleocr&quot;</text>
<text x="1130.0" y="514.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">inference_status = &quot;fallback_to_paddle_for_pdf&quot;</text>
<rect x="440.0" y="578.0" width="460.0" height="46.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="670.0" y="604.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">effective engine → router.get_engine(name).run(image)</text>
<rect x="40.0" y="660.0" width="236.0" height="84.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="158.0" y="693.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PaddleOCREngine</text>
<text x="158.0" y="704.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PP-OCRv5</text>
<text x="158.0" y="716.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(text lines + boxes)</text>
<rect x="296.0" y="660.0" width="236.0" height="84.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="414.0" y="693.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PaddleOCRModernEngine</text>
<text x="414.0" y="704.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PP-StructureV3 + PP-OCRv6</text>
<text x="414.0" y="716.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(markdown/html/tables)</text>
<rect x="552.0" y="660.0" width="236.0" height="84.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="670.0" y="693.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VietOCREngine</text>
<text x="670.0" y="704.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PP-OCRv5 detector +</text>
<text x="670.0" y="716.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VietOCR recognizer</text>
<rect x="808.0" y="660.0" width="236.0" height="84.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="926.0" y="693.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLMOCREngine</text>
<text x="926.0" y="704.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PP-DocLayoutV3 + GLM-OCR</text>
<text x="926.0" y="716.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VLM (subprocess)</text>
<rect x="1064.0" y="660.0" width="236.0" height="84.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="1182.0" y="699.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLMVietOCREngine</text>
<text x="1182.0" y="710.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM layout + VietOCR text</text>
<rect x="40.0" y="782.0" width="620.0" height="128.0" rx="9" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="350.0" y="824.7" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">RULE 2 (per-block rule, only inside GLMVietOCREngine)</text>
<text x="350.0" y="836.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• block label ∈ {table, figure, image, equation, formula, code} → keep the GLM text verbatim</text>
<text x="350.0" y="849.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• otherwise assign the VietOCR text lines whose centre falls inside the GLM block box</text>
<text x="350.0" y="861.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• sanity check: if len(GLM text) &gt; 40 chars and the VietOCR text is &lt; 25 % of that length,</text>
<text x="350.0" y="873.5" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">reject it and fall back to the GLM text (recognition_source = &quot;glm&quot; / &quot;fallback&quot;)</text>
<path d="M700.0,782.0 h586.0 l14.0,14.0 v114.0 h-600.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1286.0,782.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="1000.0" y="818.6" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Additional facts from the source</text>
<text x="1000.0" y="830.8" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• paddleocr_modern is registered in router.py and reachable through the API, but it is not</text>
<text x="1000.0" y="843.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">offered in the SPA drop-down (static/index.html).</text>
<text x="1000.0" y="855.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• The chosen engine is recorded per request: res[&quot;selected_engine&quot;], res[&quot;ocr_engine&quot;] and the</text>
<text x="1000.0" y="867.4" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">ActivityLog detail string, so repeated runs on one document can be compared afterwards.</text>
<text x="1000.0" y="879.6" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">• The user&#x27;s manual choice is preserved for the whole session (OCRView._sessionEngine).</text>
</svg>