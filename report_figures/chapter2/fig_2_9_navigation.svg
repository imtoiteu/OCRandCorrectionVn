<text x="695.0" y="925.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Trang /correction chỉ truy cập được bằng URL — thanh điều hướng của SPA (static/index.html) không có liên kết tới nó. Nút Back / Forward của trình duyệt hoạt động tự nhiên vì location.hash là nguồn trạng thái duy nhất của SPA;</text>
