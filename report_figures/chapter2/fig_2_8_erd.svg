<text x="675.0" y="800.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Ghi chú đối chiếu — phần thuyết minh đề xuất các thực thể User, Role, Document, DocumentPage, OCRJob, OCRResult, OCRConfiguration, ActivityLog và ErrorLog. Mã nguồn chỉ có bốn bảng vẽ ở trên: không có bảng Role (role</text>
<text x="675.0" y="813.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">là một cột chuỗi trong bảng users), không có DocumentPage, OCRJob, OCRResult, OCRConfiguration hay ErrorLog. Kết quả OCR theo từng trang được lưu dưới dạng JSON trong document_artifacts, tham số công cụ OCR nằm trong</text>
<text x="675.0" y="825.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">biến môi trường do config.py đọc, còn lỗi được ghi vào nhật ký ứng dụng và bảng activity_logs.</text>
<path d="M70.0,878.0 h1196.0 l14.0,14.0 v62.0 h-1210.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1266.0,878.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="675.0" y="913.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Năm bảng bên phải được khai báo trong models.py nên vẫn được db.create_all() tạo ra, nhưng không tuyến nào của phiên bản này đọc hay ghi chúng — các blueprint trò chuyện / RAG / tác tử đã bị gỡ bỏ (xem chú thích trong</text>
<text x="675.0" y="925.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">app.py::_persist_and_index). Chúng được vẽ để mô tả đầy đủ lược đồ vật lý và không được trình bày như chức năng đang hoạt động.</text>
