<text x="675.0" y="800.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Fidelity note — the report text suggests the entities User, Role, Document, DocumentPage, OCRJob, OCRResult, OCRConfiguration, ActivityLog and ErrorLog. The implementation contains only the four tables drawn above:</text>
<text x="675.0" y="813.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">there is no Role table (role is a string column on users), no DocumentPage, OCRJob, OCRResult, OCRConfiguration or ErrorLog table. Per-page OCR output is stored as JSON inside document_artifacts, OCR engine settings</text>
<text x="675.0" y="825.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">live in environment variables read by config.py, and errors are recorded in the application log and in activity_logs.</text>
<path d="M70.0,878.0 h1196.0 l14.0,14.0 v62.0 h-1210.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1266.0,878.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="675.0" y="913.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">The five tables on the right are defined in models.py and are therefore created by db.create_all(), but no route in this build reads or writes them — the chat / RAG / agent blueprints were removed (see the comment in</text>
<text x="675.0" y="925.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">app.py::_persist_and_index). They are shown for completeness of the physical schema and must not be presented as active functionality.</text>
