<text x="670.0" y="696.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Sự kiện triển khai lấy từ kho mã nguồn: ứng dụng web không dùng container, máy chủ proxy ngược, máy chủ WSGI cho môi trường thật, hàng đợi thông điệp hay dịch vụ đám mây nào — app.py khởi động chính máy chủ phát triển đa</text>
<text x="670.0" y="709.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">luồng của Flask. Các tệp Dockerfile và kịch bản khởi động Docker trong glm-ocr-server/apps/ thuộc bản demo GLM-OCR gốc (FastAPI + React) và không được SmartDocs sử dụng. Tiến trình 2 và 3 là tùy chọn: nếu thiếu, chỉ còn</text>
<text x="670.0" y="721.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">các công cụ PaddleOCR / VietOCR hoạt động.</text>
