<text x="670.0" y="696.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Deployment facts taken from the repository: there is no container, reverse proxy, production WSGI server, message queue or managed cloud service for the web application — app.py starts Flask&#x27;s own threaded development</text>
<text x="670.0" y="709.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">server. The Dockerfiles and docker start scripts under glm-ocr-server/apps/ belong to the upstream GLM-OCR demo (FastAPI backend + React frontend) and are not used by SmartDocs. Processes 2 and 3 are optional: without them</text>
<text x="670.0" y="721.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">only the PaddleOCR / VietOCR engines are available.</text>
