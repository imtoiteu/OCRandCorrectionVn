<ellipse cx="441.0" cy="169.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="166.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Đăng nhập / Đăng xuất</text>
<text x="441.0" y="177.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/login · /logout</text>
<ellipse cx="441.0" cy="223.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="220.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Tải tài liệu lên</text>
<text x="441.0" y="231.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/upload</text>
<ellipse cx="441.0" cy="277.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="274.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Xem trước và chuyển trang</text>
<text x="441.0" y="285.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/page (preview_only)</text>
<ellipse cx="441.0" cy="331.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="328.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Lựa chọn công cụ OCR</text>
<text x="441.0" y="339.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(tham số engine)</text>
<ellipse cx="441.0" cy="385.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="382.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Thực hiện OCR một trang</text>
<text x="441.0" y="393.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/page</text>
<ellipse cx="441.0" cy="439.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="436.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Thực hiện OCR toàn bộ trang</text>
<text x="441.0" y="447.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/all</text>
<ellipse cx="441.0" cy="493.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="490.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Sắp xếp lại một vùng đã chọn</text>
<text x="441.0" y="501.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/reconstruct-region</text>
<ellipse cx="441.0" cy="547.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="544.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Đọc văn bản từ TXT / DOCX / PDF</text>
<text x="441.0" y="555.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/read-text</text>
<ellipse cx="441.0" cy="601.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="598.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Xem kết quả (Markdown · Raw ·</text>
<text x="441.0" y="609.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Images · JSON)</text>
<ellipse cx="441.0" cy="655.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="652.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Sao chép và tải kết quả</text>
<text x="441.0" y="663.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">.md · .txt · .json · .docx</text>
<ellipse cx="441.0" cy="709.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="706.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Quản lý tài liệu của mình</text>
<text x="441.0" y="717.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GET/DELETE /api/documents</text>
<ellipse cx="441.0" cy="763.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="760.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Chạy hiệu chỉnh tiếng Việt</text>
<text x="441.0" y="771.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/correction/run</text>
<ellipse cx="441.0" cy="817.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="814.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Lưu và mở lại bản đã hiệu chỉnh</text>
<text x="441.0" y="825.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/api/correction/save · /result</text>
<ellipse cx="441.0" cy="871.0" rx="165.0" ry="23.0" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="441.0" y="868.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Đổi ngôn ngữ giao diện</text>
<text x="441.0" y="879.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/set-lang</text>
<ellipse cx="835.0" cy="333.0" rx="175.0" ry="33.0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="835.0" y="330.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Xem trang tổng quan quản trị</text>
<text x="835.0" y="341.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GET /admin/</text>
<ellipse cx="835.0" cy="429.0" rx="175.0" ry="33.0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="835.0" y="420.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Quản lý tài khoản người dùng</text>
<text x="835.0" y="431.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">tạo · sửa · đặt lại mật khẩu</text>
<text x="835.0" y="443.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">khóa/mở khóa · xóa</text>
<ellipse cx="835.0" cy="525.0" rx="175.0" ry="33.0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="835.0" y="522.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Giám sát toàn bộ tài liệu</text>
<text x="835.0" y="533.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GET /admin/files</text>
<ellipse cx="835.0" cy="621.0" rx="175.0" ry="33.0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="835.0" y="618.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Xem nhật ký hoạt động</text>
<text x="835.0" y="629.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GET /admin/logs</text>
<ellipse cx="835.0" cy="717.0" rx="175.0" ry="33.0" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="835.0" y="714.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Truy cập tài liệu của mọi người dùng</text>
<text x="835.0" y="725.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(ngoại lệ trong kiểm tra quyền sở hữu)</text>
<path d="M240.0,1000.0 h786.0 l14.0,14.0 v48.0 h-800.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1026.0,1000.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="640.0" y="1028.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Ghi chú phạm vi: hệ thống không có màn hình &quot;cấu hình OCR&quot; trong ứng dụng — các giá trị mặc định của công cụ OCR được đặt bằng biến môi trường</text>
<text x="640.0" y="1040.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">do config.py đọc (OCR_ENGINE, VIETOCR_*, GLM_*, VI_CORRECTION_*). Vì vậy không có ca sử dụng tương ứng.</text>
