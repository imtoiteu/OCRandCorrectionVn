<text x="720.0" y="986.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Dữ kiện về tích hợp: năm bộ thích nghi được khởi tạo một lần lúc nạp router.py, nên các mô hình nặng chỉ được nạp ở lần dùng đầu tiên rồi tái sử dụng. Thêm hoặc thay một công cụ OCR chỉ cần thêm một lớp con OCREngine và một mục trong _ENGINES /</text>
<text x="720.0" y="999.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">_ALIASES — API tải tệp, phần lưu trữ và lược đồ cơ sở dữ liệu đều không đổi, vì mọi công cụ trả về cùng một hợp đồng kết quả. Nhánh GLM là nhánh duy nhất rời khỏi tiến trình Flask, và cũng là nhánh duy nhất có thể hỏng vì thiếu môi trường (venv</text>
<text x="720.0" y="1011.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">SDK) hoặc vì máy chủ mô hình không chạy.</text>
