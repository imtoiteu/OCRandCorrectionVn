<rect x="64.0" y="150.0" width="470.0" height="152.0" rx="9" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
<text x="299.0" y="188.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Cửa sổ lệnh 1   —   máy chủ mô hình GLM-OCR MLX</text>
<text x="299.0" y="200.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="299.0" y="211.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM_ROOT=&quot;$PWD/glm-ocr-server&quot;</text>
<text x="299.0" y="223.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM_MLX_PYTHON=&quot;$PWD/glm-ocr-server/.venv-mlx/bin/python&quot;</text>
<text x="299.0" y="234.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">bash glm-ocr-ui/tools/glm_serve.sh</text>
<text x="299.0" y="246.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="299.0" y="257.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">exec python -m mlx_vlm.server --trust-remote-code --port 8080</text>
<text x="299.0" y="269.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">mô hình nằm thường trú giữa các yêu cầu</text>
<rect x="552.0" y="150.0" width="466.0" height="152.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="785.0" y="194.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Cửa sổ lệnh 2   —   ứng dụng web SmartDocs</text>
<text x="785.0" y="205.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="785.0" y="217.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">cd glm-ocr-ui  ·  source .venv/bin/activate</text>
<text x="785.0" y="228.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">python app.py</text>
<text x="785.0" y="240.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="785.0" y="252.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">máy chủ phát triển đa luồng của Flask</text>
<text x="785.0" y="263.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">http://localhost:5001   (HOST 0.0.0.0, PORT 5001)</text>
<rect x="64.0" y="328.0" width="470.0" height="96.0" rx="9" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
<text x="299.0" y="361.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM-OCR SDK  —  glm-ocr-server/.venv-sdk</text>
<text x="299.0" y="373.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">được glm_adapter.py khởi chạy cho mỗi yêu cầu OCR:</text>
<text x="299.0" y="384.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">python -m glmocr.cli parse &lt;page.png&gt; --config mlx_config.yaml --mode selfhosted</text>
<text x="299.0" y="396.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PP-DocLayoutV3 chạy trên CPU (mlx_config.yaml: layout.device = cpu)</text>
<rect x="552.0" y="328.0" width="466.0" height="96.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="785.0" y="361.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Công cụ OCR chạy trong tiến trình Flask</text>
<text x="785.0" y="373.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PaddleOCR PP-OCRv5 · PP-StructureV3 + PP-OCRv6_medium</text>
<text x="785.0" y="384.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VietOCR vgg_transformer</text>
<text x="785.0" y="396.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">cfg.DEVICE tự phân giải: CUDA → MPS → CPU</text>
<path d="M64.0,459.0 a150.0,9.0 0 0 0 300.0,0 v70.0 a150.0,9.0 0 0 1 -300.0,0 z" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<ellipse cx="214.0" cy="459.0" rx="150.0" ry="9.0" fill="#F0F0F0" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="214.0" y="484.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">SQLite  paddleocr.db</text>
<text x="214.0" y="495.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">tạo bởi db.create_all()</text>
<text x="214.0" y="507.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">tài khoản khởi tạo sẵn:</text>
<text x="214.0" y="518.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">admin / admin123 · user / user123</text>
<rect x="384.0" y="450.0" width="300.0" height="88.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="534.0" y="479.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">uploads/</text>
<text x="534.0" y="491.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">tệp gốc, đặt tên theo UUID</text>
<text x="534.0" y="502.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">+ tệp .png tạm của từng trang</text>
<text x="534.0" y="514.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MAX_UPLOAD_MB = 50</text>
<rect x="704.0" y="450.0" width="314.0" height="88.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="861.0" y="485.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">models/ · bộ nhớ đệm HF · PaddleX</text>
<text x="861.0" y="496.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">OFFLINE=0 ở lần chạy đầu để tải mô hình,</text>
<text x="861.0" y="508.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">sau đó OFFLINE=1 để chạy ngoại tuyến</text>
<rect x="64.0" y="562.0" width="954.0" height="152.0" rx="9" fill="#F5F5F5" stroke="#999999" stroke-width="1.6"/>
<text x="541.0" y="606.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Các khóa .env xác định môi trường này  (glm-ocr-ui/.env, theo .env.example và RUN_MACOS.md)</text>
<text x="541.0" y="617.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="541.0" y="629.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">HOST=0.0.0.0   PORT=5001   OFFLINE=0/1   DEVICE=auto   MODEL_DIR=./models   OCR_ENGINE=paddle</text>
<text x="541.0" y="640.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM_ROOT=&lt;repo&gt;/glm-ocr-server        GLM_SDK_PYTHON=&lt;repo&gt;/glm-ocr-server/.venv-sdk/bin/python</text>
<text x="541.0" y="652.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM_MLX_PYTHON=&lt;repo&gt;/glm-ocr-server/.venv-mlx/bin/python     GLM_CONFIG_YAML=&lt;repo&gt;/glm-ocr-server/mlx_config.yaml</text>
<text x="541.0" y="664.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM_OCR_API_URL=http://localhost:8080   GLM_TIMEOUT=300</text>
<text x="541.0" y="675.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VI_CORRECTION_ENABLED=true   VI_CORRECTION_PROVIDER=protonx   VI_CORRECTION_MODEL=nano   VI_CORRECTION_DEVICE=cpu</text>
<rect x="1080.0" y="150.0" width="280.0" height="130.0" rx="9" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/>
<text x="1220.0" y="193.7" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Người kiểm thử</text>
<text x="1220.0" y="205.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">trình duyệt trên cùng máy</text>
<text x="1220.0" y="218.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">(http://localhost:5001)</text>
<text x="1220.0" y="230.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">hoặc trên một máy khác cùng</text>
<text x="1220.0" y="242.5" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">mạng nội bộ (HOST = 0.0.0.0)</text>
<path d="M1080.0,310.0 h286.0 l14.0,14.0 v286.0 h-300.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1366.0,310.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="1230.0" y="376.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">CẦN HOÀN THIỆN THỦ CÔNG</text>
<text x="1230.0" y="387.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1230.0" y="399.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Phần thuyết minh yêu cầu Hình 3.9 thể hiện WebApp ở</text>
<text x="1230.0" y="410.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">cổng 5002 và một DesktopApp với ba chế độ Bundled</text>
<text x="1230.0" y="422.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Core, Existing WebApp Runtime và Remote Server.</text>
<text x="1230.0" y="434.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1230.0" y="445.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Kho mã nguồn này không có cả hai: cổng ứng dụng là</text>
<text x="1230.0" y="457.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">5001 (mặc định trong config.py và trong RUN_MACOS.md),</text>
<text x="1230.0" y="468.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">không có ứng dụng desktop, không có phần chọn chế độ</text>
<text x="1230.0" y="480.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">chạy và không có mã kết nối tới máy chủ từ xa.</text>
<text x="1230.0" y="491.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1230.0" y="503.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Cổng 5002 chỉ xuất hiện trong</text>
<text x="1230.0" y="515.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm-ocr-server/glmocr/config.yaml và mlx_config.yaml,</text>
<text x="1230.0" y="526.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">là cổng mặc định của dịch vụ HTTP tùy chọn</text>
<text x="1230.0" y="538.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glmocr.server mà SmartDocs không dùng — SmartDocs gọi</text>
<text x="1230.0" y="549.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">trực tiếp qua dòng lệnh.</text>
<path d="M40.0,762.0 h1306.0 l14.0,14.0 v48.0 h-1320.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1346.0,762.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="700.0" y="790.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Nguyên tắc truy cập thể hiện trong mô hình triển khai: trình duyệt chỉ làm việc với Flask ở cổng 5001. Máy chủ mô hình MLX ở cổng 8080 chỉ được tiến trình con glmocr tạm thời gọi tới, còn cơ sở dữ liệu và thư mục uploads chỉ được app.py</text>
<text x="700.0" y="802.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">/ models.py truy cập, nhờ đó phân quyền, trạng thái tài liệu và nhật ký hoạt động luôn nhất quán bất kể người dùng truy cập bằng cách nào.</text>
<path d="M40.0,838.0 h1306.0 l14.0,14.0 v48.0 h-1320.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1346.0,838.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="700.0" y="866.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Không thuộc môi trường thử nghiệm: không có container runtime, không có proxy ngược, không có máy chủ WSGI cho môi trường thật, không có cơ sở dữ liệu ngoài và không có dịch vụ OCR đám mây. Nhánh đám mây (MaaS) của SDK bị tắt bởi</text>
<text x="700.0" y="878.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">mlx_config.yaml (pipeline.maas.enabled = false) và bộ thích nghi luôn truyền tham số --mode selfhosted.</text>
</svg>