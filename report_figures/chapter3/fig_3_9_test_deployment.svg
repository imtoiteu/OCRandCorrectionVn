<text x="54.0" y="120.0" font-size="14.5" font-weight="700" fill="#10202E">Test machine  —  macOS Apple Silicon (M1 / M2 / M3 / M4) · Python 3.10 · Homebrew</text>
<path d="M1080.0,215.0 L1018.0,226.0" fill="none" stroke="#3F61A8" stroke-width="1.7" marker-end="url(#arr_3F61A8)"/>
