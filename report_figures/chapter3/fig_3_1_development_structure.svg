<text x="1165.0" y="234.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Pillow · layoutparser · python-docx · python-dotenv</text>
<rect x="972.0" y="282.0" width="386.0" height="78.0" rx="9" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
<text x="1165.0" y="312.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm-ocr-server/.venv-sdk          Python 3.10</text>
<text x="1165.0" y="323.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">pip install -e &quot;.[selfhosted]&quot;</text>
<text x="1165.0" y="335.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">cung cấp lệnh glmocr mà GLMOCREngine gọi tới</text>
<rect x="972.0" y="374.0" width="386.0" height="78.0" rx="9" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.6"/>
<text x="1165.0" y="404.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm-ocr-server/.venv-mlx          Python 3.10</text>
<text x="1165.0" y="415.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">pip install -U mlx-vlm</text>
<text x="1165.0" y="427.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">chạy  python -m mlx_vlm.server --port 8080</text>
<rect x="972.0" y="466.0" width="386.0" height="74.0" rx="9" fill="#F5F5F5" stroke="#999999" stroke-width="1.6"/>
<text x="1165.0" y="489.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Cả ba môi trường đều không được đưa vào git;</text>
<text x="1165.0" y="500.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">tất cả được tạo theo RUN_MACOS.md (§3, §6, §7). GLM_ROOT / GLM_SDK_PYTHON /</text>
<text x="1165.0" y="511.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">GLM_MLX_PYTHON trong .env</text>
<text x="1165.0" y="522.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">chỉ cho glm-ocr-ui biết vị trí hai môi trường kia.</text>
<rect x="950.0" y="590.0" width="430.0" height="140.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1165.0" y="628.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Tệp mô hình được phân giải lúc chạy</text>
<text x="1165.0" y="639.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1165.0" y="651.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• MODEL_DIR/huggingface  —  HF_HOME / HF_HUB_CACHE (OFFLINE=1 chặn tải về)</text>
<text x="1165.0" y="662.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• bộ nhớ đệm mô hình PaddleOCR / PaddleX  —  tải về ở lần OCR đầu tiên</text>
<text x="1165.0" y="674.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• MODEL_DIR/vietocr/&lt;config&gt;.pth  —  trọng số VietOCR</text>
<text x="1165.0" y="686.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• bộ nhớ đệm HF mặc định  —  PP-DocLayoutV3 và mlx-community/GLM-OCR-bf16</text>
<text x="1165.0" y="697.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(tiến trình con GLM cố ý chạy không kèm các biến HF_* đã đổi hướng)</text>
<path d="M950.0,756.0 h416.0 l14.0,14.0 v218.0 h-430.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1366.0,756.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="1165.0" y="805.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">CẦN HOÀN THIỆN THỦ CÔNG</text>
<text x="1165.0" y="817.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1165.0" y="828.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Phần thuyết minh mô tả Hình 3.1 gồm hai khối là SmartDocs-Agent-WebApp và</text>
<text x="1165.0" y="840.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">SmartDocs-Agent-DesktopApp (Tauri/Rust, giao diện web nhúng, Python sidecar và</text>
<text x="1165.0" y="851.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">ba chế độ kết nối backend).</text>
<text x="1165.0" y="863.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1165.0" y="874.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Kho mã nguồn này không có mã của ứng dụng desktop. Tìm trên toàn kho các từ</text>
<text x="1165.0" y="886.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">khóa &quot;tauri&quot;, &quot;sidecar&quot;, &quot;Bundled Core&quot;, &quot;Remote Server&quot; và cổng 5002 đều không</text>
<text x="1165.0" y="898.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">ra mã ứng dụng, cũng không có thư mục src-tauri/, tệp Cargo.toml hay</text>
<text x="1165.0" y="909.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">package.json của một vỏ desktop.</text>
<text x="1165.0" y="921.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="1165.0" y="932.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Chỉ khối WebApp ở trên là dựng được từ mã nguồn. Khối DesktopApp phải bổ sung</text>
<text x="1165.0" y="944.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">thủ công, hoặc thu hẹp chú thích hình lại còn WebApp.</text>
<path d="M40.0,1096.0 h1326.0 l14.0,14.0 v46.0 h-1340.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1366.0,1096.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="710.0" y="1123.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Ghi chú khi đọc — README.md và docs/ trong glm-ocr-ui mô tả một sản phẩm lớn hơn (&quot;SmartDocs-Agent&quot; với trò chuyện RAG, dịch, tóm tắt, tác tử LLM, gói agent/). Các thư mục đó không có trong kho mã nguồn này; requirements.txt vẫn còn liệt kê</text>
<text x="710.0" y="1135.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">thư viện của chúng. Hình chỉ thể hiện các tệp thực sự tồn tại trong cây thư mục làm việc.</text>
</svg>