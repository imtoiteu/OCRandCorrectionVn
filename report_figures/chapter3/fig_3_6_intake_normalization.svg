<rect x="62.0" y="138.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="157.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">User selects or drops a file in the SPA</text>
<text x="370.0" y="168.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(accept = .jpg .jpeg .png .webp .pdf .txt .docx)</text>
<rect x="62.0" y="198.0" width="616.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="370.0" y="215.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Flask rejects the body if it exceeds</text>
<text x="370.0" y="226.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MAX_CONTENT_LENGTH → 413 JSON</text>
<rect x="62.0" y="254.0" width="616.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="370.0" y="271.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">@login_required  ·  request.files.get(&quot;file&quot;)</text>
<text x="370.0" y="282.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">missing file → 400</text>
<rect x="62.0" y="310.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="329.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">_safe_basename(): drop directory parts, strip</text>
<text x="370.0" y="340.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">control characters, keep Unicode, cap 255 chars</text>
<rect x="62.0" y="370.0" width="616.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="370.0" y="387.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">suffix = Path(name).suffix.lower()</text>
<text x="370.0" y="398.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">suffix ∈ ALL_EXTS ?   otherwise 400</text>
<rect x="62.0" y="426.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="445.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">fid = uuid4()   ·   file saved as</text>
<text x="370.0" y="456.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">UPLOAD_DIR/{fid}{suffix}  (name never user-supplied)</text>
<rect x="62.0" y="486.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="505.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">page_count = pdf_page_count() for PDF, else 1</text>
<text x="370.0" y="516.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">file_size = path.stat().st_size</text>
<rect x="62.0" y="546.0" width="616.0" height="44.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="370.0" y="565.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">INSERT Document(user_id, filename, file_id, file_type,</text>
<text x="370.0" y="576.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">file_size, page_count, status=&quot;uploaded&quot;)</text>
<rect x="62.0" y="606.0" width="616.0" height="36.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="370.0" y="626.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">log_activity(&quot;upload&quot;, &quot;&lt;name&gt; (&lt;suffix&gt;, &lt;size&gt;B)&quot;)</text>
<rect x="62.0" y="654.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="673.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">200 {file_id, filename, size, suffix, doc_id,</text>
<text x="370.0" y="684.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">is_pdf, is_image, page_count}</text>
<rect x="762.0" y="138.0" width="596.0" height="44.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="1060.0" y="157.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">_resolve_owned_file(file_id)</text>
<text x="1060.0" y="168.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Document lookup → 404 · ownership → 403</text>
<rect x="762.0" y="198.0" width="596.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="217.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glob UPLOAD_DIR/{stored uuid}.*</text>
<text x="1060.0" y="228.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">never globs the raw file_id → traversal-proof</text>
<rect x="762.0" y="258.0" width="596.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="1060.0" y="275.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/api/ocr/all only: reject anything that is not</text>
<text x="1060.0" y="286.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">an image or a PDF → 400</text>
<rect x="762.0" y="314.0" width="596.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="1060.0" y="336.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">suffix == &quot;.pdf&quot; ?</text>
<rect x="762.0" y="370.0" width="596.0" height="56.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="389.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PDF: pypdfium2 renders page N at scale = 2.0</text>
<text x="1060.0" y="400.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">→ PIL image → NamedTemporaryFile(&quot;.png&quot;) inside</text>
<text x="1060.0" y="412.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">UPLOAD_DIR (deleted in the finally block)</text>
<rect x="762.0" y="442.0" width="596.0" height="48.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="463.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Image: PIL.Image.open(path) directly</text>
<text x="1060.0" y="474.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(no resizing, no binarization, no deskew)</text>
<rect x="762.0" y="506.0" width="596.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="525.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">preview_only = true → return page_image_b64 +</text>
<text x="1060.0" y="536.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">img_width / img_height, results = [] (no OCR)</text>
<rect x="762.0" y="566.0" width="596.0" height="44.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="1060.0" y="585.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">_resolve_selected_engine(): engine parameter →</text>
<text x="1060.0" y="596.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">alias → cfg.OCR_ENGINE; vietocr + .pdf → paddleocr</text>
<rect x="762.0" y="626.0" width="596.0" height="40.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="1060.0" y="643.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">smart_ocr_service.run_ocr_pipeline(image_path,</text>
<text x="1060.0" y="654.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">engine_name)  →  OCR router (Figure 3.7)</text>
<rect x="762.0" y="678.0" width="596.0" height="36.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="698.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">page_image_b64 attached to the response for the canvas overlay</text>
<rect x="62.0" y="812.0" width="400.0" height="56.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="262.0" y="837.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">text_service.read_file(path)</text>
<text x="262.0" y="849.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">dispatch on the file extension</text>
<rect x="500.0" y="806.0" width="250.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="625.0" y="834.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">.txt</text>
<text x="625.0" y="846.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">open(errors=&quot;replace&quot;)</text>
<rect x="500.0" y="878.0" width="250.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="625.0" y="906.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">.docx</text>
<text x="625.0" y="918.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">python-docx paragraphs</text>
<rect x="790.0" y="842.0" width="250.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="915.0" y="863.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">.pdf</text>
<text x="915.0" y="876.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">pypdfium2 text page</text>
<text x="915.0" y="888.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">(embedded text, no OCR)</text>
<rect x="1078.0" y="842.0" width="280.0" height="62.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1218.0" y="870.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">_persist_and_index(file_id, &quot;text&quot;, text)</text>
<text x="1218.0" y="882.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">→ save_artifact(kind = &quot;text&quot;)</text>
<rect x="40.0" y="984.0" width="660.0" height="108.0" rx="9" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
<text x="370.0" y="1012.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Implemented error branches</text>
<text x="370.0" y="1023.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• body too large → 413 {&quot;error&quot;: &quot;File too large (max N MB)&quot;}</text>
<text x="370.0" y="1035.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• no file / unsupported suffix → 400</text>
<text x="370.0" y="1046.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• unknown file_id → 404;  foreign document → 403 (admins exempt)</text>
<text x="370.0" y="1058.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• file record present but missing on disk → 404 &quot;File missing from disk&quot;</text>
<text x="370.0" y="1069.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• any exception inside the OCR call → 500 with the traceback written to the log</text>
<path d="M740.0,984.0 h626.0 l14.0,14.0 v94.0 h-640.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1366.0,984.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="1060.0" y="1017.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Scope of &quot;normalization&quot; in this implementation</text>
<text x="1060.0" y="1029.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">The only image preparation performed by the application is page rasterization (pypdfium2, scale = 2.0) and format</text>
<text x="1060.0" y="1040.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">conversion to PNG/JPEG. Orientation classification and UVDoc unwarping happen only inside the PaddleOCR Modern pipeline</text>
<text x="1060.0" y="1052.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(PPStructureV3(use_doc_orientation_classify=True, use_doc_unwarping=True)). No deskew, denoise, binarization or DPI</text>
<text x="1060.0" y="1064.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">normalization step exists in the application code.</text>
<path d="M40.0,1108.0 h1326.0 l14.0,14.0 v20.0 h-1340.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1366.0,1108.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="710.0" y="1128.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Result caching: _run_page_ocr() stores each page result in an in-memory dictionary keyed by (sha-256 of the file, page number, size + mtime, engine name), so re-running the same page with the same engine does not repeat the inference.</text>
</svg>