<text x="1060.0" y="643.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">smart_ocr_service.run_ocr_pipeline(image_path,</text>
<text x="1060.0" y="654.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">engine_name)  →  bộ định tuyến OCR (Hình 3.7)</text>
<rect x="762.0" y="678.0" width="596.0" height="36.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="698.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">page_image_b64 được gắn vào phản hồi để vẽ lớp phủ trên canvas</text>
