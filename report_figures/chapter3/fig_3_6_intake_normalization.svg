<text x="1060.0" y="389.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PDF: pypdfium2 kết xuất trang N ở scale = 2.0</text>
<text x="1060.0" y="400.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">→ ảnh PIL → NamedTemporaryFile(&quot;.png&quot;) trong</text>
<text x="1060.0" y="412.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">UPLOAD_DIR (xóa trong khối finally)</text>
