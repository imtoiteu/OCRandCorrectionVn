<text x="370.0" y="626.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">log_activity(&quot;upload&quot;, &quot;&lt;tên tệp&gt; (&lt;suffix&gt;, &lt;dung lượng&gt;B)&quot;)</text>
<rect x="62.0" y="654.0" width="616.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="370.0" y="673.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">200 {file_id, filename, size, suffix, doc_id,</text>
<text x="370.0" y="684.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">is_pdf, is_image, page_count}</text>
<rect x="762.0" y="138.0" width="596.0" height="44.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="1060.0" y="157.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">_resolve_owned_file(file_id)</text>
<text x="1060.0" y="168.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">tra cứu Document → 404 · quyền sở hữu → 403</text>
<rect x="762.0" y="198.0" width="596.0" height="44.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="1060.0" y="217.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">dò UPLOAD_DIR/{uuid đã lưu}.*</text>
<text x="1060.0" y="228.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">không bao giờ dò bằng file_id thô → chống vượt thư mục</text>
<rect x="762.0" y="258.0" width="596.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="1060.0" y="275.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">riêng /api/ocr/all: từ chối mọi thứ không phải</text>
<text x="1060.0" y="286.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">ảnh hoặc PDF → 400</text>
