<text x="1060.0" y="463.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Ảnh: PIL.Image.open(path) trực tiếp</text>
<text x="1060.0" y="474.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(không đổi kích thước, không nhị phân hóa, không nắn nghiêng)</text>
