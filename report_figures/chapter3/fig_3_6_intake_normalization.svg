<text x="370.0" y="340.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">điều khiển, giữ Unicode, giới hạn 255 ký tự</text>
<rect x="62.0" y="370.0" width="616.0" height="40.0" rx="9" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="370.0" y="387.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">suffix = Path(name).suffix.lower()</text>
<text x="370.0" y="398.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">suffix ∈ ALL_EXTS ?   nếu không → 400</text>
