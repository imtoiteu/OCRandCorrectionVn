<text x="915.0" y="888.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">(văn bản nhúng, không OCR)</text>
<rect x="1078.0" y="842.0" width="280.0" height="62.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1218.0" y="870.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">_persist_and_index(file_id, &quot;text&quot;, text)</text>
<text x="1218.0" y="882.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">→ save_artifact(kind = &quot;text&quot;)</text>
<rect x="40.0" y="984.0" width="660.0" height="108.0" rx="9" fill="#F8CECC" stroke="#B85450" stroke-width="1.6"/>
<text x="370.0" y="1012.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Các nhánh lỗi đã hiện thực hóa</text>
<text x="370.0" y="1023.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• tệp quá lớn → 413 {&quot;error&quot;: &quot;File too large (max N MB)&quot;}</text>
<text x="370.0" y="1035.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• không có tệp / phần mở rộng không hỗ trợ → 400</text>
<text x="370.0" y="1046.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• file_id không tồn tại → 404;  tài liệu của người khác → 403 (quản trị viên là ngoại lệ)</text>
<text x="370.0" y="1058.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• có bản ghi nhưng thiếu tệp trên đĩa → 404 &quot;File missing from disk&quot;</text>
<text x="370.0" y="1069.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">• mọi ngoại lệ bên trong lời gọi OCR → 500 và vết lỗi được ghi vào nhật ký</text>
<path d="M740.0,984.0 h626.0 l14.0,14.0 v94.0 h-640.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1366.0,984.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="1060.0" y="1017.8" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Phạm vi của &quot;chuẩn hóa&quot; trong phiên bản này</text>
<text x="1060.0" y="1029.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Ứng dụng chỉ chuẩn bị ảnh ở mức kết xuất trang (pypdfium2, scale = 2.0) và chuyển đổi định dạng sang PNG/JPEG. Phân</text>
<text x="1060.0" y="1040.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">loại hướng tài liệu và nắn phẳng UVDoc chỉ xảy ra bên trong pipeline PaddleOCR Modern</text>
<text x="1060.0" y="1052.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">(PPStructureV3(use_doc_orientation_classify=True, use_doc_unwarping=True)). Mã ứng dụng không có bước nắn nghiêng, khử</text>
<text x="1060.0" y="1064.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">nhiễu, nhị phân hóa hay chuẩn hóa DPI.</text>
<path d="M40.0,1108.0 h1326.0 l14.0,14.0 v20.0 h-1340.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1366.0,1108.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="710.0" y="1122.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Bộ nhớ đệm kết quả: _run_page_ocr() lưu kết quả mỗi trang vào một từ điển trong bộ nhớ, khóa theo (sha-256 của tệp, số trang, kích thước + thời điểm sửa, tên công cụ), nên chạy lại đúng trang đó với cùng công cụ sẽ không lặp lại quá trình</text>
<text x="710.0" y="1134.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">suy luận.</text>
</svg>