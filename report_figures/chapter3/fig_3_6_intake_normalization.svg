<text x="370.0" y="445.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">fid = uuid4()   ·   tệp được lưu thành</text>
<text x="370.0" y="456.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">UPLOAD_DIR/{fid}{suffix}  (tên không lấy từ người dùng)</text>
