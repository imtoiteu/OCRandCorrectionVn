<text x="720.0" y="786.0" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle"></text>
<text x="720.0" y="797.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PaddleOCR Legacy   →  kết quả + độ tin cậy + khung bao;  ocr_json chứa results + layout_blocks;  ảnh phủ tự sinh</text>
<text x="720.0" y="809.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">VietOCR                    →  kết quả + khung bao (độ tin cậy = None);  ocr_json dạng dự phòng;  ảnh phủ tự sinh</text>
<text x="720.0" y="820.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">PaddleOCR Modern  →  kết quả + độ tin cậy + khung bao  +  markdown, html, tables_html, layout_blocks, ảnh phủ có nhãn</text>
<text x="720.0" y="832.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM-OCR                  →  kết quả + khung bao (độ tin cậy = None)  +  markdown, tables_html, layout_blocks, raw_json,</text>
<text x="720.0" y="843.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">ảnh layout_vis và ảnh cắt từng vùng</text>
<text x="720.0" y="855.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">GLM + VietOCR        →  bố cục của GLM với văn bản của VietOCR, kèm recognition_source và fallback_reason theo khối</text>
<path d="M40.0,900.0 h1346.0 l14.0,14.0 v82.0 h-1360.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1386.0,900.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="720.0" y="945.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">MỘT PHẦN — phần thuyết minh trình bày Hình 3.8 dưới dạng ảnh chụp màn hình kết quả. Hình ở trên là kiến trúc và luồng dữ liệu phía sau màn hình đó, tức là phần mà mã nguồn hỗ trợ. Nếu báo cáo cần chính màn hình, hãy chụp khu vực làm việc OCR</text>
<text x="720.0" y="957.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">của một tài liệu với các thẻ Markdown, Raw, Images và JSON hiển thị cạnh ảnh trang (xem MANUAL_COMPLETION.md, Hình 3.8).</text>
