<defs>
<marker id="arr_445" markerWidth="11" markerHeight="11" refX="8.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#445"/></marker>
<marker id="arr_4B6E9C" markerWidth="11" markerHeight="11" refX="8.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#4B6E9C"/></marker>
</defs>
<rect x="0" y="0" width="1420" height="1090" fill="#FFFFFF"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#10202E">Hình 4.3 – Một số bước kiểm thử chức năng xử lý tài liệu</text>
<line x1="40" y1="48" x2="1380" y2="48" stroke="#10202E" stroke-width="1.5"/>
<text x="40" y="64" font-size="11.5" fill="#5A6B7B">Quy trình kiểm thử chức năng rút ra từ luồng xử lý đã hiện thực hóa; mỗi bước ghi rõ lời gọi API và dữ liệu quan sát được mà hệ thống sinh ra</text>
<path d="M190.0,228.0 L190.0,238.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,314.0 L190.0,324.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,400.0 L190.0,410.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,486.0 L190.0,496.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,572.0 L190.0,582.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,658.0 L190.0,668.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,744.0 L190.0,754.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,830.0 L190.0,840.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<path d="M190.0,916.0 L190.0,926.0" fill="none" stroke="#4B6E9C" stroke-width="1.7" marker-end="url(#arr_4B6E9C)"/>
<rect x="40.0" y="100.0" width="300.0" height="38.0" rx="0" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="122.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">Bước kiểm thử</text>
<rect x="360.0" y="100.0" width="480.0" height="38.0" rx="0" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="122.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">Thao tác và lời gọi API được kiểm tra</text>
<rect x="860.0" y="100.0" width="520.0" height="38.0" rx="0" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="122.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">Dữ liệu quan sát do hệ thống sinh ra</text>
<rect x="40.0" y="152.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="193.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">a)  Đăng nhập</text>
<rect x="360.0" y="152.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="181.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Mở http://localhost:5001 → mọi yêu cầu chưa xác thực</text>
<text x="600.0" y="192.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">đều được trả về biểu mẫu đăng nhập.</text>
<text x="600.0" y="203.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /login  (user / user123)</text>
<rect x="860.0" y="152.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="187.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: chuyển hướng về /, thanh điều hướng hiện tên</text>
<text x="1120.0" y="198.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">và vai trò người dùng; activity_logs thêm action = &quot;login&quot;.</text>
<rect x="40.0" y="238.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="279.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">b)  Tải tài liệu lên</text>
<rect x="360.0" y="238.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="273.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Màn hình OCR → vùng kéo thả hoặc hộp chọn tệp.</text>
<text x="600.0" y="284.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/upload  (multipart)</text>
<rect x="860.0" y="238.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="267.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: mã 200 kèm file_id, page_count, is_pdf;</text>
<text x="1120.0" y="278.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">tệp xuất hiện trong uploads/ dạng {uuid}{suffix};</text>
<text x="1120.0" y="289.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">bản ghi Document có status = &quot;uploaded&quot;; nhật ký action = &quot;upload&quot;.</text>
<rect x="40.0" y="324.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="365.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">c)  Xem trước và chuyển trang</text>
<rect x="360.0" y="324.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="359.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/page với preview_only = true</text>
<text x="600.0" y="370.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">(nút chuyển trang khi tài liệu là PDF)</text>
<rect x="860.0" y="324.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="359.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: page_image_b64 được vẽ lên canvas,</text>
<text x="1120.0" y="370.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">results = [], chưa chạy OCR, chưa ghi kết xuất nào.</text>
<rect x="40.0" y="410.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="451.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">d)  Lựa chọn công cụ OCR</text>
<rect x="360.0" y="410.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="439.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Hộp thả xuống: Recommended (glmocr) ·</text>
<text x="600.0" y="450.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">GLM Layout + VietOCR Text · Vietnamese (vietocr) ·</text>
<text x="600.0" y="461.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Standard (paddleocr)</text>
<rect x="860.0" y="410.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="439.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: giá trị đã chọn được gửi trong trường &quot;engine&quot;</text>
<text x="1120.0" y="450.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">và trả về trong selected_engine;</text>
<text x="1120.0" y="461.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">lựa chọn được giữ trong suốt phiên làm việc.</text>
<rect x="40.0" y="496.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="537.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">e)  Chạy nhận dạng và theo dõi trạng thái</text>
<rect x="360.0" y="496.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="525.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/page  (Run OCR)  hoặc</text>
<text x="600.0" y="536.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/all  (OCR All) · nút Stop hủy lời gọi</text>
<text x="600.0" y="547.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">fetch ở phía trình duyệt</text>
<rect x="860.0" y="496.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="525.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: processing_time_ms và inference_status theo từng</text>
<text x="1120.0" y="536.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">trang; dải thống kê hiện số vùng, độ tin cậy trung bình,</text>
<text x="1120.0" y="547.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">thời gian và số trang; nhật ký action = &quot;ocr&quot; kèm chi tiết.</text>
<rect x="40.0" y="582.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="623.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">f)  Kiểm tra các dạng biểu diễn kết quả</text>
<rect x="360.0" y="582.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="611.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Các thẻ kết quả: Markdown · Raw · Images · JSON;</text>
<text x="600.0" y="622.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">bấm vào một vùng sẽ làm nổi bật khung bao</text>
<text x="600.0" y="633.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">tương ứng trên ảnh trang</text>
<rect x="860.0" y="582.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="611.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: các kết xuất ocr, ocr_layout, ocr_json,</text>
<text x="1120.0" y="622.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">ocr_markdown, ocr_images được ghi vào document_artifacts</text>
<text x="1120.0" y="633.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">(mỗi loại một bản ghi, ghi đè khi chạy lại).</text>
<rect x="40.0" y="668.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="709.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">g)  Kết xuất kết quả</text>
<rect x="360.0" y="668.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="703.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Tải về .md / .txt / .json;</text>
<text x="600.0" y="714.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/ocr/export-docx  (pandoc)</text>
<rect x="860.0" y="668.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="703.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: tệp được tải xuống; nếu thiếu pandoc thì trả về</text>
<text x="1120.0" y="714.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">501 kèm thông báo giải thích thay vì báo lỗi chung.</text>
<rect x="40.0" y="754.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="795.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">h)  Mở lại từ thư viện tài liệu</text>
<rect x="360.0" y="754.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="783.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">#documents → mở một tài liệu →</text>
<text x="600.0" y="794.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">#ocr/&lt;file_id&gt; → GET /api/documents/&lt;id&gt;/text</text>
<text x="600.0" y="805.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">và /ocr-images</text>
<rect x="860.0" y="754.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="789.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: kết quả OCR trước đó, khung bao và ảnh minh họa</text>
<text x="1120.0" y="800.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">được khôi phục mà không phải chạy lại OCR.</text>
<rect x="40.0" y="840.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="881.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">i)  Tùy chọn — hiệu chỉnh tiếng Việt</text>
<rect x="360.0" y="840.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="875.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">GET /correction → chọn tài liệu đã có ocr_json →</text>
<text x="600.0" y="886.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/correction/run → POST /api/correction/save</text>
<rect x="860.0" y="840.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="869.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: số liệu đếm, thời gian và báo cáo kiểm tra;</text>
<text x="1120.0" y="880.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">corrected_json / corrected_md được lưu song song, không</text>
<text x="1120.0" y="891.8" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">bao giờ ghi đè kết xuất OCR gốc.</text>
<rect x="40.0" y="926.0" width="300.0" height="76.0" rx="9" fill="#F2F7FD" stroke="#4B6E9C" stroke-width="1.6"/>
<text x="190.0" y="967.4" font-size="11.0" font-weight="700" fill="#15202B" text-anchor="middle">j)  Kiểm tra chức năng quản trị</text>
<rect x="360.0" y="926.0" width="480.0" height="76.0" rx="9" fill="#D4E1F5" stroke="#3F61A8" stroke-width="1.6"/>
<text x="600.0" y="961.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">/admin/ tổng quan · /admin/users · /admin/logs ·</text>
<text x="600.0" y="972.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">/admin/files   (admin / admin123)</text>
<rect x="860.0" y="926.0" width="520.0" height="76.0" rx="9" fill="#EDEDED" stroke="#5A5A5A" stroke-width="1.6"/>
<text x="1120.0" y="961.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">Quan sát: mọi thao tác ở trên đều xuất hiện trong danh sách</text>
<text x="1120.0" y="972.3" font-size="9.0" font-weight="400" fill="#15202B" text-anchor="middle">nhật ký; tài khoản thường truy cập các URL đó sẽ nhận 403.</text>
<path d="M40.0,1024.0 h1326.0 l14.0,14.0 v30.0 h-1340.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1366.0,1024.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="710.0" y="1049.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Ghi chú về ảnh chụp: phần thuyết minh trình bày Hình 4.3 dưới dạng các ảnh a) tải tệp, b) lựa chọn công cụ OCR, c) kết quả nhận dạng, d) lịch sử xử lý — xem MANUAL_COMPLETION.md.</text>
</svg>