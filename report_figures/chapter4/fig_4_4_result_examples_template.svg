<text x="700.0" y="117.8" font-size="10.5" font-weight="700" fill="#15202B" text-anchor="middle">Hình này không thể sinh ra từ mã nguồn vì nó trình bày kết quả nhận dạng trên tài liệu thật. Khung dưới đây liệt kê tài liệu mẫu đã có sẵn trong kho để việc chụp ảnh được nhất quán. Không dùng lại các kết quả tham chiếu đã lưu</text>
<text x="700.0" y="130.7" font-size="10.5" font-weight="700" fill="#15202B" text-anchor="middle">như thể chúng là kết quả do hệ thống này chạy ra, nếu chưa chạy lại.</text>
