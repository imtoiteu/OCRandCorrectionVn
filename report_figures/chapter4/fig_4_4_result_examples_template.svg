<text x="700.0" y="739.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Cách chụp lại từng ảnh một cách tái lặp được: tải tệp mẫu lên qua POST /api/upload, chạy OCR với một công cụ đã chỉ định rõ, rồi dùng màn hình làm việc OCR để đặt ảnh trang (có hiển thị khung bao nhận dạng) cạnh thẻ Markdown hoặc Raw.</text>
<text x="700.0" y="751.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Các giá trị cần cho chú thích đều hiện trên dải thống kê và cũng được ghi vào activity_logs, nhờ đó hình và phần thuyết minh luôn khớp nhau.</text>
