<text x="40" y="38" font-size="20" font-weight="700" fill="#10202E">Hình 4.4 – Minh họa kết quả OCR trên một số nhóm tài liệu  (khung trình bày)</text>
<line x1="40" y1="48" x2="1360" y2="48" stroke="#10202E" stroke-width="1.5"/>
<text x="40" y="64" font-size="11.5" fill="#5A6B7B">KHUNG TRÌNH BÀY — không tái hiện bất kỳ kết quả OCR nào ở đây. Các ô chỉ nêu tên tệp mẫu đã có trong kho mã nguồn và vị trí cần chèn ảnh chụp.</text>
<path d="M40.0,92.0 h1306.0 l14.0,14.0 v44.0 h-1320.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
