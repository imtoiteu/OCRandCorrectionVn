<text x="700.0" y="836.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Yêu cầu trung thực đã nêu trong báo cáo: phải có ít nhất một trường hợp khó, và không được chỉ chọn các ví dụ cho kết quả đẹp. Kho mã nguồn cung cấp ba mẫu dùng được; ảnh chụp chất lượng thấp phải do tác giả tự bổ sung.</text>
