<text x="40" y="38" font-size="20" font-weight="700" fill="#10202E">Hình 4.2 – Quy trình chuẩn bị dữ liệu và đánh giá kết quả OCR</text>
<line x1="40" y1="48" x2="1380" y2="48" stroke="#10202E" stroke-width="1.5"/>
<text x="40" y="64" font-size="11.5" fill="#5A6B7B">Khối tô màu là bước đã có mã hoặc dữ liệu trong kho; khối viền đỏ nền trắng là bước CHƯA hiện thực hóa, phải làm thủ công</text>
