<text x="40" y="38" font-size="20" font-weight="700" fill="#10202E">Hình 4.2 – Quy trình chuẩn bị dữ liệu và đánh giá kết quả OCR</text>
<line x1="40" y1="48" x2="1380" y2="48" stroke="#10202E" stroke-width="1.5"/>
<text x="40" y="64" font-size="11.5" fill="#5A6B7B">Filled boxes are supported by code or data in the repository; red-outlined boxes are NOT implemented and must be done manually</text>
<rect x="40" y="156" width="660" height="476" rx="11" fill="#EFF6EE" stroke="#82B366" stroke-width="1.6"/>
<path d="M40.0,190.0 L40.0,167.0 A11,11 0 0 1 51.0,156.0 L689.0,156.0 A11,11 0 0 1 700.0,167.0 L700.0,190.0 Z" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="54.0" y="180.0" font-size="14.5" font-weight="700" fill="#10202E">Data preparation</text>
<rect x="740" y="156" width="640" height="476" rx="11" fill="#E0F4F5" stroke="#0E8088" stroke-width="1.6"/>
<path d="M740.0,190.0 L740.0,167.0 A11,11 0 0 1 751.0,156.0 L1369.0,156.0 A11,11 0 0 1 1380.0,167.0 L1380.0,190.0 Z" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="754.0" y="180.0" font-size="14.5" font-weight="700" fill="#10202E">Measurement and scoring</text>
<rect x="40" y="668" width="1340" height="218" rx="11" fill="#FFFAEB" stroke="#D6B656" stroke-width="1.6"/>
<path d="M40.0,702.0 L40.0,679.0 A11,11 0 0 1 51.0,668.0 L1369.0,668.0 A11,11 0 0 1 1380.0,679.0 L1380.0,702.0 Z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.6"/>
<text x="54.0" y="692.0" font-size="14.5" font-weight="700" fill="#10202E">Aggregation and reporting</text>
