<text x="710.0" y="117.3" font-size="10.5" font-weight="700" fill="#15202B" text-anchor="middle">LEGEND      coloured fill = implemented in the repository (the responsible file is named in the box)            red outline on white = no implementation exists — the step must be performed manually</text>
<rect x="62.0" y="204.0" width="616.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="226.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Select the documents to evaluate</text>
<text x="370.0" y="237.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Samples available in the repository:</text>
<text x="370.0" y="249.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">examples/source/*.png · GLM-4.5V.pdf</text>
<rect x="62.0" y="280.0" width="616.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="302.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Group them by document type</text>
<text x="370.0" y="313.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">printed page · scientific paper · table ·</text>
<text x="370.0" y="325.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">seal · source code · handwriting</text>
<rect x="62.0" y="356.0" width="616.0" height="58.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="376.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Upload each document through the SPA</text>
<text x="370.0" y="387.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/upload → Document row +</text>
<text x="370.0" y="399.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">uploads/{uuid}{suffix}</text>
<rect x="62.0" y="428.0" width="616.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="450.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Run OCR once per engine on the same file</text>
<text x="370.0" y="461.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">engine parameter of /api/ocr/page and</text>
<text x="370.0" y="473.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/api/ocr/all (drop-down or API)</text>
<rect x="62.0" y="504.0" width="616.0" height="62.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="526.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Results are persisted automatically</text>
<text x="370.0" y="537.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">document_artifacts: ocr, ocr_json,</text>
<text x="370.0" y="549.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">ocr_markdown, ocr_layout, ocr_images</text>
<rect x="62.0" y="580.0" width="616.0" height="44.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="370.0" y="599.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Optional: run the Vietnamese correction</text>
<text x="370.0" y="610.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">POST /api/correction/run → corrected_json</text>
<rect x="762.0" y="204.0" width="596.0" height="68.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="1060.0" y="229.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">AUTOMATIC — processing time</text>
<text x="1060.0" y="240.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Every adapter records elapsed_ms; app.py copies it to processing_time_ms and</text>
<text x="1060.0" y="252.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">writes it into the activity_logs detail string for each page and for OCR-All.</text>
<rect x="762.0" y="284.0" width="596.0" height="68.0" rx="9" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.6"/>
<text x="1060.0" y="309.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">AUTOMATIC — recognition metadata</text>
<text x="1060.0" y="320.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">region count, mean confidence (PaddleOCR engines only), page count,</text>
<text x="1060.0" y="332.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">inference_status and the engine actually used are returned with every response.</text>
<rect x="762.0" y="364.0" width="596.0" height="76.0" rx="9" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.6"/>
<text x="1060.0" y="387.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">AUTOMATIC — correction quality signals (vi_correction)</text>
<text x="1060.0" y="399.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">counts {blocks, units, sent, changed, skipped} · timing {provider_seconds,</text>
<text x="1060.0" y="410.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">total_seconds} · validation report (structure preserved, placeholders intact)</text>
<text x="1060.0" y="422.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">plus scripts/bench_spans.py for per-span latency in the prototype.</text>
<rect x="762.0" y="452.0" width="596.0" height="62.0" rx="9" fill="#FFFFFF" stroke="#B85450" stroke-width="1.6"/>
<text x="1060.0" y="474.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MANUAL — create the ground truth</text>
<text x="1060.0" y="485.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">No transcription, annotation tool or reference-text file for the Vietnamese</text>
<text x="1060.0" y="497.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">corpus exists in the repository.</text>
<rect x="762.0" y="526.0" width="596.0" height="46.0" rx="9" fill="#FFFFFF" stroke="#B85450" stroke-width="1.6"/>
<text x="1060.0" y="546.1" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MANUAL — text normalisation before scoring</text>
<text x="1060.0" y="557.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">No normalisation routine for evaluation exists in the repository.</text>
<rect x="762.0" y="584.0" width="596.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B85450" stroke-width="1.6"/>
<text x="1060.0" y="606.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MANUAL — compute CER and WER (no implementation exists: no jiwer, no edit-distance code)</text>
<rect x="62.0" y="716.0" width="420.0" height="68.0" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.6"/>
<text x="272.0" y="735.6" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Export the raw evidence</text>
<text x="272.0" y="747.2" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/admin/logs (activity_logs, filterable) ·</text>
<text x="272.0" y="758.7" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">/api/documents/&lt;id&gt;/text (all artifacts) ·</text>
<text x="272.0" y="770.3" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">downloads .md / .txt / .json / .docx</text>
<rect x="502.0" y="716.0" width="420.0" height="68.0" rx="9" fill="#FFFFFF" stroke="#B85450" stroke-width="1.6"/>
<text x="712.0" y="741.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MANUAL — build the comparison tables</text>
<text x="712.0" y="752.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Accuracy per document group and engine;</text>
<text x="712.0" y="764.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">no aggregation script exists in the repository.</text>
<rect x="942.0" y="716.0" width="416.0" height="68.0" rx="9" fill="#FFFFFF" stroke="#B85450" stroke-width="1.6"/>
<text x="1150.0" y="741.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">MANUAL — build the timing chart (Figure 4.5)</text>
<text x="1150.0" y="752.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Separate the first-run model-loading time from the</text>
<text x="1150.0" y="764.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">steady-state time, as the report requires.</text>
<rect x="62.0" y="800.0" width="1296.0" height="68.0" rx="9" fill="#F5F5F5" stroke="#999999" stroke-width="1.6"/>
<text x="710.0" y="825.4" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">Regression / smoke tests that do exist</text>
<text x="710.0" y="836.9" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm-ocr-ui: test_layout.py · test_regression.py (reading-order reconstruction) · test_vietocr.py · test_refactored_ocr.py (engine dispatch) · test_markdown_normalize.py (pytest)</text>
<text x="710.0" y="848.5" font-size="9.5" font-weight="400" fill="#15202B" text-anchor="middle">glm-ocr-server: glmocr/tests/test_unit.py · test_integration.py (pytest, with conftest.py)   —   none of these measures OCR accuracy; they verify behaviour, not quality.</text>
<path d="M40.0,916.0 h1326.0 l14.0,14.0 v82.0 h-1340.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.4"/>
<path d="M1366.0,916.0 l14.0,14.0 h-14.0 z" fill="#FFFFFF" stroke="#B85450" stroke-width="1.2"/>
<text x="710.0" y="954.9" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">ACCURACY NOTICE — the repository contains no OCR accuracy evaluation. There is no ground-truth data set, no CER/WER or layout-accuracy implementation (a repository-wide search for CER, WER, jiwer, levenshtein and edit_distance returns</text>
<text x="710.0" y="967.1" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">nothing outside model vocabulary files), and no recorded measurement results. tools/eval_model.py and tools/ab_harness.py evaluate candidate Qwen chat/rewrite language models, not OCR, and they import services that no longer exist in this</text>
<text x="710.0" y="979.3" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">build. Everything drawn as a red-outlined box must be produced manually before Chapter 4 can report numbers.</text>
</svg>