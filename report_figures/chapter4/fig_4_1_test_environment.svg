<text x="700.0" y="804.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Every component in the figure runs on one machine. The browser never contacts the MLX model server or the database directly: the only network endpoint exposed to a tester is Flask on :5001, and :8080 is contacted only by the transient</text>
<text x="700.0" y="816.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">glmocr subprocess on localhost.</text>
<path d="M40.0,852.0 h1306.0 l14.0,14.0 v62.0 h-1320.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1346.0,852.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="700.0" y="887.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Test-environment limitations to state in the report: the application runs on Flask&#x27;s development server (single process, threaded), the database is a local SQLite file, and the GLM-OCR engine is available only on Apple Silicon with both</text>
<text x="700.0" y="899.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">virtual environments installed and the MLX server running. On a machine without them, the engine drop-down still offers &quot;Recommended&quot;, but the request returns a structured error instead of a result.</text>
