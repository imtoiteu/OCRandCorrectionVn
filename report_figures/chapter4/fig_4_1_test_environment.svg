<text x="700.0" y="804.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Toàn bộ thành phần trong hình chạy trên một máy. Trình duyệt không bao giờ liên hệ trực tiếp với máy chủ mô hình MLX hay cơ sở dữ liệu: điểm truy cập mạng duy nhất mở cho người kiểm thử là Flask ở cổng 5001, còn cổng 8080 chỉ được tiến</text>
<text x="700.0" y="816.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">trình con glmocr gọi tới qua localhost.</text>
<path d="M40.0,852.0 h1306.0 l14.0,14.0 v62.0 h-1320.0 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.4"/>
<path d="M1346.0,852.0 l14.0,14.0 h-14.0 z" fill="#FFF6DD" stroke="#D6B656" stroke-width="1.2"/>
<text x="700.0" y="887.0" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">Hạn chế của môi trường thử nghiệm cần nêu trong báo cáo: ứng dụng chạy trên máy chủ phát triển của Flask (một tiến trình, đa luồng), cơ sở dữ liệu là một tệp SQLite cục bộ, và công cụ GLM-OCR chỉ dùng được trên Apple Silicon khi đã cài</text>
<text x="700.0" y="899.2" font-size="10.0" font-weight="400" fill="#15202B" text-anchor="middle">đủ hai môi trường ảo và máy chủ MLX đang chạy. Trên máy không có các điều kiện đó, hộp chọn công cụ vẫn hiện &quot;Recommended&quot; nhưng yêu cầu sẽ trả về lỗi có cấu trúc thay vì kết quả.</text>
</svg>